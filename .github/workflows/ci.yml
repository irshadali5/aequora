name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install pinned cargo-audit
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Audit workspace dependencies
        run: cargo +stable audit --file Cargo.lock
      - name: Audit fuzz dependencies
        run: cargo +stable audit --file fuzz/Cargo.lock

  quality:
    name: Stable quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Enforce repository-wide hardening controls
        run: bash scripts/check-high-assurance-hardening.sh
      - name: Check every target and feature
        run: cargo +stable check --workspace --all-targets --all-features --locked
      - name: Enforce independent database feature profiles
        env:
          RUSTUP_TOOLCHAIN: stable
        run: bash scripts/check-database-neutrality.sh
      - name: Enforce Guppy dependency boundaries
        run: cargo +stable run -p aequora-dev --locked -- check
      - name: Validate crates.io publish dependency order
        run: python3 scripts/publish-workspace.py --plan
      - name: Enforce consistency-profile contracts and manifest compatibility rules
        run: |
          cargo +stable test -p aequora-profile --locked
          cargo +stable test -p aequora-testkit --test profile_contracts --locked
      - name: Enforce deterministic decision and replay contracts
        run: |
          cargo +stable test -p aequora-replay --locked
          cargo +stable test -p aequora-testkit --test replay_contracts --locked
      - name: Enforce canonical audit, tamper, and authorization contracts
        run: |
          cargo +stable test -p aequora-audit --locked
          cargo +stable test -p aequora-testkit --test audit_contracts --locked
      - name: Enforce governance lifecycle and distributed purge contracts
        run: |
          cargo +stable test -p aequora-governance --locked
          cargo +stable test -p aequora-testkit --test governance_contracts --locked
      - name: Enforce cryptographic integrity, key lifecycle, and protected-payload contracts
        run: |
          cargo +stable test -p aequora-crypto --locked
          cargo +stable test -p aequora-testkit --test crypto_contracts --locked
      - name: Enforce epoch-safe regional reads and authority-only writes
        run: |
          cargo +stable test -p aequora-region --locked
          cargo +stable test -p aequora-testkit --test regional_contracts --locked
      - name: Enforce durable jobs, workflows, and side-effect recovery
        run: |
          bash scripts/check-jobs-architecture.sh
          cargo +stable test -p aequora-jobs -p aequora-workflow -p aequora-side-effects --locked
          cargo +stable test -p aequora-testkit --test job_workflow_side_effect_contracts --locked
      - name: Enforce operational control-plane authorization and safety contracts
        run: |
          bash scripts/check-admin-architecture.sh
          cargo +stable test -p aequora-admin --locked
          cargo +stable test -p aequora-testkit --test admin_control_plane_contracts --locked
          cargo +stable run -p aequora-cli --locked -- admin capabilities
      - name: Enforce bounded diagnostics, bundle safety, and replay isolation
        run: |
          bash scripts/check-diagnostics-architecture.sh
          cargo +stable test -p aequora-diagnostics --locked
          cargo +stable test -p aequora-testkit --test diagnostic_incident_contracts --locked
          cargo +stable run -p aequora-cli --locked -- incident explain
      - name: Enforce security threat model and abuse-resistance contracts
        run: |
          bash scripts/check-security-architecture.sh
          cargo +stable test -p aequora-security --locked
          cargo +stable test -p aequora-testkit --test security_abuse_contracts --locked
          cargo +stable run -p aequora-cli --locked -- security show
      - name: Enforce multi-consumer change-feed contracts
        run: |
          bash scripts/check-change-feed-architecture.sh
          cargo +stable test -p aequora-feed --locked
          cargo +stable test -p aequora-testkit --test change_feed_contracts --locked
          cargo +stable run -p aequora-cli --locked -- feed show
      - name: Enforce protocol negotiation and compatibility governance
        run: |
          bash scripts/check-compatibility-architecture.sh
          cargo +stable test -p aequora-compat --locked
          cargo +stable test -p aequora-testkit --test compatibility_contracts --locked
          cargo +stable run -p aequora-cli --locked -- compat registry
      - name: Enforce durable registry and developer governance
        run: |
          bash scripts/check-registry-architecture.sh
          cargo +stable test -p aequora-registry-types -p aequora-registry-codegen -p aequora-registry-generated -p aequora-registry-cli --locked
          cargo +stable test -p aequora-testkit --test registry_contracts --locked
          cargo +stable run -p aequora-registry-cli --locked --bin aequora-registry -- verify .
      - name: Enforce certification, conformance, and ecosystem trust contracts
        run: |
          bash scripts/check-certification-architecture.sh
          cargo +stable test -p aequora-conformance --locked
          cargo +stable test -p aequora-testkit --test adapter_contracts --locked
          cargo +stable test -p aequora-testkit --test conformance_certification_contracts --locked
          cargo +stable test -p aequora-store-stoolap built_in_stoolap_passes_the_public_local_adapter_contract --locked
          cargo +stable run -p aequora-cli --locked -- conform storage
      - name: Enforce Android and iOS mobile runtime contracts
        run: bash scripts/check-mobile-architecture.sh
      - name: Enforce Linux, Windows, and macOS desktop runtime contracts
        run: bash scripts/check-desktop-architecture.sh
      - name: Enforce cross-platform local storage contracts
        run: bash scripts/check-local-storage-architecture.sh
      - name: Enforce reference workspace layers and crate dependency direction
        run: bash scripts/check-reference-implementation-architecture.sh
      - name: Enforce stable public Rust SDK and extension boundaries
        run: bash scripts/check-public-sdk-architecture.sh
      - name: Enforce storage adapter SDK and official adapter contracts
        run: bash scripts/check-storage-adapter-sdk-architecture.sh
      - name: Enforce PostgreSQL and Neon authoritative adapter contracts
        run: bash scripts/check-postgres-authority-architecture.sh
      - name: Enforce Stoolap embedded local persistence contracts
        run: bash scripts/check-stoolap-local-persistence-architecture.sh
      - name: Enforce SQLite embedded local adapter contracts
        run: bash scripts/check-sqlite-local-adapter-architecture.sh
      - name: Enforce Axum server integration and middleware contracts
        run: bash scripts/check-axum-server-architecture.sh
      - name: Enforce Dioxus reactive client boundary contracts
        run: bash scripts/check-dioxus-client-architecture.sh
      - name: Enforce CLI and developer toolchain contracts
        run: bash scripts/check-cli-toolchain-architecture.sh
      - name: Enforce bounded Part 19 performance and memory contracts
        run: |
          bash scripts/check-performance-architecture.sh
          cargo +stable test -p aequora-performance --locked
          cargo +stable test -p aequora-codec --all-features --locked
          cargo +stable test -p aequora-bootstrap --locked
          cargo +stable test -p aequora-blob --locked
          cargo +stable test -p aequora-compute --locked
      - name: Enforce legacy adoption ownership, bridge, facade, and cutover contracts
        run: |
          bash scripts/check-legacy-architecture.sh
          cargo +stable test -p aequora-legacy -p aequora-legacy-api --locked
          cargo +stable test -p aequora-testkit --test legacy_adoption_contracts --locked
      - name: Strict Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Workspace tests
        run: cargo +stable test --workspace --all-features --locked
      - name: Bounded formal model and Loom verification
        run: |
          cargo +stable run -p aequora-cli --locked -- verify model
          cargo +stable test -p aequora-client loom_single_flight --locked
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo +stable doc --workspace --all-features --no-deps --locked

  msrv:
    name: Rust 1.87 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install MSRV
        run: rustup toolchain install 1.87.0 --profile minimal
      - name: Check every target and feature at MSRV
        run: cargo +1.87.0 check --workspace --all-targets --all-features --locked

  public-api-semver:
    name: Public Rust API semver
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install pinned cargo-semver-checks
        run: cargo +stable install cargo-semver-checks --version 0.49.0 --locked
      - name: Reject accidental stable API breakage
        run: cargo semver-checks check-release -p aequora -p aequora-client -p aequora-server -p aequora-types --baseline-rev "${{ github.event.pull_request.base.sha }}"

  postgres:
    name: PostgreSQL transaction integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: aequora
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aequora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AEQUORA_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/aequora
      AEQUORA_TEST_NEON_DIRECT_URL: ${{ secrets.AEQUORA_TEST_NEON_DIRECT_URL }}
      AEQUORA_TEST_NEON_POOLED_URL: ${{ secrets.AEQUORA_TEST_NEON_POOLED_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Exercise PostgreSQL and configured Neon transaction boundaries
        run: cargo +stable test -p aequora-store-postgres --test postgres_live --locked
      - name: Exercise Stoolap client through HTTP and Axum to PostgreSQL or Neon
        run: cargo +stable test -p aequora --test database_neutrality_live --all-features --locked

  artifact-gates:
    name: Fuzz, benchmark, and examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build every fuzz target
        run: cargo +stable check --manifest-path fuzz/Cargo.toml --bins --locked
      - name: Build the Criterion pipeline harness
        run: cargo +stable bench -p aequora-testkit --bench core_pipeline --no-run --locked
      - name: Package every publishable crate
        run: cargo +stable package --workspace --no-verify --locked
      - name: Run the in-process example
        run: cargo +stable run -p aequora --example in_process --features testkit --locked
      - name: Run the Stoolap ERP example
        run: cargo +stable run -p aequora --example school_erp --features stoolap,testkit --locked

  nightly-correctness:
    name: Extended deterministic correctness
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run formal model, properties, Loom, and fault matrices
        env:
          PROPTEST_CASES: "1024"
        run: |
          cargo +stable run -p aequora-cli --locked -- verify model
          cargo +stable test -p aequora-authority -p aequora-region -p aequora-model -p aequora-replay -p aequora-audit -p aequora-governance -p aequora-crypto -p aequora-client -p aequora-testkit --locked
