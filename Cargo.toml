[workspace]
resolver = "2"
members = [
    "crates/aequora",
    "crates/aequora-admission",
    "crates/aequora-axum",
    "crates/aequora-authority",
    "crates/aequora-blob",
    "crates/aequora-bootstrap",
    "crates/aequora-client",
    "crates/aequora-cli",
    "crates/aequora-clock",
    "crates/aequora-codec",
    "crates/aequora-conflict",
    "crates/aequora-crypto",
    "crates/aequora-compute",
    "crates/aequora-coordination",
    "crates/aequora-config",
    "crates/aequora-crdt",
    "crates/aequora-dev",
    "crates/aequora-executor",
    "crates/aequora-http",
    "crates/aequora-integrity",
    "crates/aequora-invariants",
    "crates/aequora-journal",
    "crates/aequora-live",
    "crates/aequora-macros",
    "crates/aequora-model",
    "crates/aequora-observability",
    "crates/aequora-partition",
    "crates/aequora-performance",
    "crates/aequora-protocol",
    "crates/aequora-profile",
    "crates/aequora-replay",
    "crates/aequora-region",
    "crates/aequora-audit",
    "crates/aequora-governance",
    "crates/aequora-queue",
    "crates/aequora-quic",
    "crates/aequora-routing",
    "crates/aequora-scheduler",
    "crates/aequora-scope",
    "crates/aequora-schema",
    "crates/aequora-server",
    "crates/aequora-store",
    "crates/aequora-store-postgres",
    "crates/aequora-store-stoolap",
    "crates/aequora-testkit",
    "crates/aequora-transport",
    "crates/aequora-types",
    "crates/aequora-validator",
    "crates/aequora-mapping",
    "crates/aequora-migration",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/irshad/aequora"
description = "Server-authoritative, database-agnostic local-first synchronization for Rust"

[workspace.dependencies]
async-trait = "0.1.89"
argon2 = "0.5.3"
axum = "0.8.4"
blake3 = "1.8.2"
bytes = "1.10.1"
criterion = { version = "=0.5.1", features = ["async_tokio"] }
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2.0"
futures-util = "0.3.33"
getrandom = "0.3.3"
guppy = "=0.17.18"
http = "1.3.1"
http-body-util = "0.1.4"
hex = "0.4.3"
loom = "=0.7.2"
postcard = { version = "1.1.3", features = ["use-std"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
ron = "0.10.1"
rayon = "1.10.0"
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.151"
smallvec = { version = "1.15.2", features = ["serde"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid"] }
stoolap = "=0.4.0"
syn = "2.0.119"
tempfile = "3.27.0"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = "0.5.2"
tracing = "0.1.41"
uuid = { version = "1.16.0", features = ["serde", "v7"] }
zeroize = { version = "1.8.1", features = ["derive"] }
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = { level = "deny", priority = 1 }
expect_used = { level = "deny", priority = 1 }

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
