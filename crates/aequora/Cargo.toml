[package]
name = "aequora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords = ["crdt", "local-first", "sync", "distributed", "database"]
categories = ["database", "network-programming", "data-structures"]

[features]
default = ["postcard"]
postcard = []
ron = ["aequora-codec/ron"]
json = ["aequora-codec/json"]
axum = ["dep:aequora-axum", "aequora-config/axum"]
http-client = ["dep:aequora-http", "aequora-config/http-client"]
postgres = ["dep:aequora-store-postgres"]
stoolap = ["dep:aequora-store-stoolap"]
testkit = ["dep:aequora-testkit", "dep:tokio"]
tracing = ["aequora-observability/tracing"]
quic = ["dep:aequora-quic", "aequora-config/quic"]
record-sync = ["dep:aequora-mapping", "dep:aequora-migration", "dep:aequora-schema"]

[dependencies]
aequora-admission = { version = "0.1.0", path = "../aequora-admission" }
aequora-admin = { version = "0.1.0", path = "../aequora-admin" }
aequora-audit = { version = "0.1.0", path = "../aequora-audit" }
aequora-authority = { version = "0.1.0", path = "../aequora-authority" }
aequora-axum = { version = "0.1.0", path = "../aequora-axum", optional = true }
aequora-blob = { version = "0.1.0", path = "../aequora-blob" }
aequora-bootstrap = { version = "0.1.0", path = "../aequora-bootstrap" }
aequora-client = { version = "0.1.0", path = "../aequora-client" }
aequora-clock = { version = "0.1.0", path = "../aequora-clock" }
aequora-codec = { version = "0.1.0", path = "../aequora-codec" }
aequora-conflict = { version = "0.1.0", path = "../aequora-conflict" }
aequora-compute = { version = "0.1.0", path = "../aequora-compute" }
aequora-conformance = { version = "0.1.0", path = "../aequora-conformance" }
aequora-compat = { version = "0.1.0", path = "../aequora-compat" }
aequora-coordination = { version = "0.1.0", path = "../aequora-coordination" }
aequora-crypto = { version = "0.1.0", path = "../aequora-crypto" }
