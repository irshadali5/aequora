[package]
name = "aequora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords = ["crdt", "local-first", "sync", "distributed", "database"]
categories = ["database", "network-programming", "data-structures"]

[features]
default = []
macros = ["dep:aequora-executor", "dep:aequora-macros", "dep:aequora-profile"]
# Compatibility feature names for repository integration examples. Application code should add
# the owning adapter/integration crate directly.
axum = ["dep:aequora-axum"]
http-client = ["dep:aequora-http"]
postgres = ["dep:aequora-store-postgres"]
sqlite = ["dep:aequora-store-sqlite"]
stoolap = ["dep:aequora-store-stoolap"]
testkit = ["dep:aequora-testkit"]

[dependencies]
aequora-adapter-sdk = { version = "0.1.0", path = "../aequora-adapter-sdk" }
aequora-client = { version = "0.1.0", path = "../aequora-client" }
aequora-operation = { version = "0.1.0", path = "../aequora-operation" }
aequora-registry-generated = { version = "0.1.0", path = "../aequora-registry-generated" }
aequora-server = { version = "0.1.0", path = "../aequora-server" }
aequora-types = { version = "0.1.0", path = "../aequora-types" }

aequora-executor = { version = "0.1.0", path = "../aequora-executor", optional = true }
aequora-macros = { version = "0.1.0", path = "../aequora-macros", optional = true }
aequora-profile = { version = "0.1.0", path = "../aequora-profile", optional = true }

aequora-axum = { version = "0.1.0", path = "../aequora-axum", optional = true }
aequora-http = { version = "0.1.0", path = "../aequora-http", optional = true }
aequora-store-postgres = { version = "0.1.0", path = "../aequora-store-postgres", optional = true }
aequora-store-sqlite = { version = "0.1.0", path = "../aequora-store-sqlite", optional = true }
aequora-store-stoolap = { version = "0.1.0", path = "../aequora-store-stoolap", optional = true }
aequora-testkit = { version = "0.1.0", path = "../aequora-testkit", optional = true }

[[example]]
name = "in_process"
required-features = ["testkit"]

[[example]]
name = "school_erp"
required-features = ["stoolap", "testkit"]

[[test]]
name = "adapter_manifests"
required-features = ["postgres", "sqlite", "stoolap"]

[[test]]
name = "derive_operation"
required-features = ["macros"]

[dev-dependencies]
aequora-clock = { version = "0.1.0", path = "../aequora-clock" }
aequora-conflict = { version = "0.1.0", path = "../aequora-conflict" }
aequora-executor = { version = "0.1.0", path = "../aequora-executor" }
aequora-protocol = { version = "0.1.0", path = "../aequora-protocol" }
aequora-store = { version = "0.1.0", path = "../aequora-store" }
async-trait.workspace = true
axum.workspace = true
hex.workspace = true
postcard.workspace = true
reqwest.workspace = true
serde.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
