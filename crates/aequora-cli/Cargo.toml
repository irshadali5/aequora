[package]
name = "aequora-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Payload-free adapter diagnostics and verification for Aequora"
repository.workspace = true

[[bin]]
name = "aequora"
path = "src/main.rs"
doc = false

[[example]]
name = "generated_client_starter"
path = "templates/client.rs"

[[example]]
name = "generated_server_starter"
path = "templates/server.rs"

[dependencies]
