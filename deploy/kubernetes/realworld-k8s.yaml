apiVersion: v1
kind: ConfigMap
metadata:
  name: aequora-server-config
data:
  PORT: "8443"
  HOST: "0.0.0.0"
  RUST_LOG: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aequora-server
  labels:
    app: aequora
    role: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aequora
      role: api
  template:
    metadata:
      labels:
        app: aequora
        role: api
    spec:
      containers:
        - name: aequora-api
          image: localhost/aequora-server:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: aequora-server-config
          ports:
            - name: https
              containerPort: 8443
              hostPort: 8443
          readinessProbe:
            httpGet:
              path: /sync/v1/health/ready
              port: 8443
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /sync/v1/health/live
              port: 8443
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "4"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: aequora-api
  labels:
    app: aequora
spec:
  type: ClusterIP
  selector:
    app: aequora
    role: api
  ports:
    - name: api
      port: 8443
      targetPort: 8443
